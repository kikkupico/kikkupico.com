project:
  type: website
  output-dir: _site
  resources:
    - favicon/

website:
  description: "A blog built with Quarto"
  site-url: https://kikkupico.com
  title: "kikkupico"
  search: false
  navbar:
    collapse: false
    right:
      - text: About
        href: about.qmd
      - text: GitHub
        href: https://github.com/kikkupico
      - text: LinkedIn
        href: https://www.linkedin.com/in/ramakrishnan-veeraragavan-725797205/
format:
  html:
    theme:
      - default
      - custom.scss
    title-block-banner: false
    anchor-sections: false
    include-in-header:
      - text: |
          <link rel="icon" href="/favicon/favicon.ico" sizes="any">
          <link rel="icon" href="/favicon/favicon-32x32.png" type="image/png">
          <link rel="icon" href="/favicon/favicon-16x16.png" type="image/png">
      - text: |
          <script>
            window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
          </script>
          <script defer src="/_vercel/insights/script.js"></script>



